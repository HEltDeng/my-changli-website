  <head>
    <meta charset="UTF-8">

  </head>
  <body data-page="thanks">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html" aria-label="我的长理首页"><img src="/assets/images/app-icon.png" width="38" height="38" alt=""><span>我的长理</span></a><button class="menu-button" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="site-nav" data-menu-button><span></span><span></span><span></span></button><nav class="site-nav" id="site-nav" aria-label="主要导航" data-site-nav data-open="false"><a href="index.html" data-nav-page="home">首页</a><a href="features.html" data-nav-page="features">功能介绍</a><a href="download.html" data-nav-page="download">下载</a><a href="updates.html" data-nav-page="updates">更新日志</a><a href="guides.html" data-nav-page="guides">指南</a></nav></div></header>

    <main id="main-content">
      <section class="page-hero compact-hero">
        <div class="container page-hero-inner">
          <p class="eyebrow">支持开发者</p>
          <h1>感谢你的认可和支持。</h1>
          <p>支持完全自愿，不影响应用任何功能、服务或后续更新。</p>
        </div>
      </section>

      <section class="section">
        <div class="container support-layout">
          <div class="support-choices" aria-label="选择支持方式">
            <button class="support-choice" type="button" data-support-button="alipay" aria-expanded="false" aria-controls="alipay-panel">
              <span>支持支付宝</span>
              <small>点击打开支持入口</small>
            </button>
            <button class="support-choice" type="button" data-support-button="wechat" aria-expanded="false" aria-controls="wechat-panel">
              <span>支持微信</span>
              <small>点击打开支持入口</small>
            </button>
          </div>

          <div class="support-panels" aria-live="polite">
            <section class="support-panel" id="alipay-panel" data-support-panel="alipay" hidden>
              <p class="section-kicker">支付宝支持</p>
              <div class="qr-frame">
                <img data-support-image="alipay" alt="支付宝支持二维码" hidden>
                <div class="qr-placeholder" data-support-placeholder="alipay"><strong>二维码尚未配置</strong><span>配置完成后将在这里显示。</span></div>
              </div>
            </section>
            <section class="support-panel" id="wechat-panel" data-support-panel="wechat" hidden>
              <p class="section-kicker">微信支持</p>
              <div class="qr-frame">
                <img data-support-image="wechat" alt="微信支持二维码" hidden>
                <div class="qr-placeholder" data-support-placeholder="wechat"><strong>二维码尚未配置</strong><span>配置完成后将在这里显示。</span></div>
              </div>
            </section>
            <div class="support-empty" data-support-empty>
              <span class="feature-icon"><img src="/assets/icons/smartphone.svg" alt=""></span>
              <h2>选择一种支持方式</h2>
              <p>支付信息默认不显示；点击后优先打开已配置链接，无链接时显示二维码。</p>
            </div>
          </div>

          <p class="support-note">支持完全自愿；请核对打开的页面或二维码后再继续。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer"><div class="container footer-inner"><div class="footer-brand"><strong>我的长理</strong><span>版本 <span data-footer-version>__MYCHANGLI_DISPLAY_VERSION__</span></span></div><nav class="footer-links" aria-label="页脚导航"><a href="privacy.html">隐私政策</a><a href="terms.html">用户协议</a><a href="manual.html">软件说明书</a><a href="contact.html">联系反馈</a><a href="thanks.html">感谢</a></nav></div><div class="container footer-filing" data-filing><span>© 2026 我的长理</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">湘ICP备2026035265号-1</a></div></footer>
  </body>
</html>
