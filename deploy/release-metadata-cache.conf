# Add inside the existing mychangliapp.cn HTTPS server only.
# Applied 2026-10-01 to /etc/nginx/sites-available/mychangli-website.
# Do not include in API, template-gallery, or classroom server blocks.
location = /releases/latest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
location = /config/site-config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
